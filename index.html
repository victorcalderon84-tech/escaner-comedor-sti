<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner de Comedor - STI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --azul: #1e5aa8;
      --azul-oscuro: #123c73;
      --verde: #2e9e5b;
      --verde-oscuro: #1f7a44;
      --rojo: #c0392b;
      --gris: #6b7280;
      --gris-claro: #f2f4f7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0f172a;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: #1f2937;
    }
    .contenedor {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      padding: 16px;
    }
    .encabezado { text-align: center; padding: 10px 0 16px 0; }
    .encabezado h1 { font-size: 18px; color: var(--azul-oscuro); margin: 0 0 4px 0; }
    .badge-comedor {
      display: inline-block; padding: 5px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 700; color: white; margin-top: 6px;
    }
    .badge-comedor.antracita { background: var(--azul); }
    .badge-comedor.externo { background: var(--verde); }

    .tarjeta { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; margin-bottom: 14px; }

    select, input[type="text"] {
      width: 100%; padding: 12px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 10px;
    }

    .opciones { display: flex; gap: 10px; margin-bottom: 10px; }
    .opcion {
      flex: 1; text-align: center; padding: 14px 6px; border: 2px solid #e5e7eb;
      border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 14px; color: #374151;
    }
    .opcion.activo { border-color: var(--verde); background: #eafaf0; color: var(--verde-oscuro); }

    .btn-grande {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
      border: none; border-radius: 12px; background: var(--azul); color: white; cursor: pointer;
    }
    .btn-grande:disabled { background: #b7c3d0; }

    #lector { width: 100%; border-radius: 12px; overflow: hidden; }
    .contenedor-lector { position: relative; }

    .marco-qr {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(220px, 65vw);
      aspect-ratio: 1 / 1;
      border: 3px solid var(--verde);
      border-radius: 16px;
      pointer-events: none;
      overflow: hidden;
      z-index: 6;
      display: none; /* se muestra junto con el video real, ver JS */
    }

    .barra-escaneo {
      position: absolute;
      left: 6%;
      width: 88%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--verde), transparent);
      box-shadow: 0 0 8px var(--verde);
      top: 10%;
      animation: barridoEscaneo 1.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes barridoEscaneo {
      0%   { top: 8%; }
      50%  { top: 90%; }
      100% { top: 8%; }
    }

    .contador {
      text-align: center; background: var(--gris-claro); border-radius: 10px; padding: 10px;
      font-size: 15px; font-weight: 700; color: var(--azul-oscuro); margin-bottom: 12px;
    }

    .resultado {
      border-radius: 12px; padding: 16px; text-align: center; font-weight: 700;
      margin-bottom: 12px; font-size: 15px;
    }
    .resultado.ok { background: #eafaf0; color: var(--verde-oscuro); border: 2px solid var(--verde); }
    .resultado.error { background: #fdecea; color: var(--rojo); border: 2px solid var(--rojo); }

    .oculto { display: none !important; }
    .pie { text-align: center; margin-top: 16px; font-size: 11px; color: #b0b7c1; }
    .btn-cambiar {
      display: block; text-align: center; margin-top: 10px; font-size: 13px;
      color: var(--azul); text-decoration: underline; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="contenedor">
  <div class="encabezado">
    <h1>ESCÁNER DE COMEDOR</h1>
    <div id="badgeComedor" class="badge-comedor"></div>
  </div>

  <div id="pasoComedor" class="tarjeta oculto">
    <p style="font-weight:600; margin-top:0;">Seleccione el comedor:</p>
    <div class="opciones">
      <div class="opcion" onclick="elegirComedor('ANTRACITA')">ANTRACITA</div>
      <div class="opcion" onclick="elegirComedor('EXTERNO')">EXTERNO</div>
    </div>
  </div>

  <div id="pasoClave" class="tarjeta oculto">
    <p style="font-weight:600; margin-top:0;">Ingrese la clave de acceso de este comedor:</p>
    <input type="text" id="inputClave" placeholder="Clave de acceso">
    <button class="btn-grande" onclick="validarClave()">Ingresar</button>
    <div id="mensajeClave" style="color:var(--rojo); font-size:13px; margin-top:8px; text-align:center;"></div>
  </div>

  <div id="pasoTipo" class="tarjeta oculto">
    <p style="font-weight:600; margin-top:0;">¿Qué se está sirviendo?</p>
    <div class="opciones">
      <div class="opcion" id="opAlmuerzo" onclick="elegirTipo('ALMUERZO')">ALMUERZO</div>
      <div class="opcion" id="opCena" onclick="elegirTipo('CENA')">CENA</div>
    </div>
  </div>

  <div id="pasoEscaner" class="oculto">
    <div class="contador" id="contadorServidos">0 servidos</div>
    <div id="resultadoEscaneo" class="oculto"></div>
    <div id="debugTiempos" style="text-align:center; font-size:12px; color:var(--gris); margin-bottom:8px;"></div>
    <div id="debugExtra" class="oculto" style="text-align:center; font-size:11px; color:var(--gris); margin-bottom:6px;"></div>
    <div id="bloquePruebaQr" class="oculto" style="text-align:center; margin-bottom:8px;">
      <button type="button" class="btn-mini" onclick="iniciarPruebaQr()">INICIAR PRUEBA DE LECTURA</button>
      <div id="resultadoPruebaQr" style="font-size:12px; color:var(--azul-oscuro); margin-top:4px;"></div>
    </div>
    <div class="tarjeta" style="padding:8px;">
      <div class="contenedor-lector">
        <div id="lector"></div>
        <div class="marco-qr" id="marcoQr">
          <div class="barra-escaneo" id="barraEscaneo"></div>
        </div>
      </div>
    </div>
    <div class="btn-cambiar" onclick="reiniciarFlujo()">Cambiar tipo de servicio / comedor</div>
  </div>

  <div class="pie">Elaborado por VCA</div>
</div>

<script>
  // ⚠️ IMPORTANTE: reemplaza esta URL por tu enlace /exec real de Apps Script.
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzYHyShOC3uewrN9Ov0jZXtOomOEkoGfLun0bxtUdTo8HRSj506Fy1XMks6mVpqlOjU/exec';

  const parametrosUrl = new URLSearchParams(window.location.search);
  let comedorActual = (parametrosUrl.get('comedor') || '').toUpperCase();
  let claveActual = '';
  let tipoActual = '';
  let contadorServidos = 0;
  let escanerActivo = null;
  let procesandoEscaneo = false;
  let tListoParaEscanear = null; // marca de tiempo desde que la cámara queda lista para el próximo escaneo (diagnóstico temporal)
  let audioCtxCompartido = null;
  let audioListo = false; // confirma que el desbloqueo de audio ya se completó de verdad (necesario en Chrome/Android)
  const PAUSA_MS_OK = 700;    // pausa fija tras un escaneo válido, independiente de si el sonido suena o no
  const PAUSA_MS_ERROR = 1000; // pausa fija tras un escaneo rechazado, independiente de si el sonido suena o no
  let ultimoQrProcesado = null;
  let ultimoQrProcesadoHasta = 0;
  const BLOQUEO_MISMO_QR_MS = 4000;

  // --- FASE II: perfiles de prueba (solo activos con ?debug=1 en la URL, invisibles para el usuario normal) ---
  const DEBUG_MODE = parametrosUrl.get('debug') === '1';
  const PERFIL_ACTUAL = DEBUG_MODE ? (parametrosUrl.get('perfilqr') || 'A') : 'A';
  const PERFILES_QR = {
    A: { qrbox: 220, disableFlip: false, estrategiaCamara: 'actual' },     // comportamiento actual, sin cambios (baseline)
    B: { qrbox: 220, disableFlip: false, estrategiaCamara: 'corregida' },  // elimina el conflicto idCamara/videoConstraints
    C: { qrbox: 220, disableFlip: true,  estrategiaCamara: 'corregida' },  // igual que B + disableFlip
    D: { qrbox: 260, disableFlip: false, estrategiaCamara: 'corregida' },  // igual que B + qrbox más grande
    E: { qrbox: 280, disableFlip: false, estrategiaCamara: 'corregida' }
  };
  function obtenerPerfilQr_() { return PERFILES_QR[PERFIL_ACTUAL] || PERFILES_QR.A; }
  let tInicioPruebaQr = null; // "Modo prueba QR": marca de tiempo del botón "INICIAR PRUEBA DE LECTURA" (solo debug)

  // Se llama SOLO desde el toque directo del botón ALMUERZO/CENA (requisito de Android para autorizar audio).
  function desbloquearAudio_() {
    try {
      if (!audioCtxCompartido) {
        audioCtxCompartido = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxCompartido;

      // Truco de desbloqueo: reproducir un sonido silencioso real (no solo "resume"), más confiable en Android.
      const buffer = ctx.createBuffer(1, 1, 22050);
      const fuente = ctx.createBufferSource();
      fuente.buffer = buffer;
      fuente.connect(ctx.destination);
      fuente.start(0);

      const continuar = function () { audioListo = true; };
      if (ctx.state === 'suspended') {
        ctx.resume().then(continuar).catch(continuar);
      } else {
        continuar();
      }
    } catch (e) {
      audioListo = false; // si falla, el sistema sigue funcionando con vibración y mensaje en pantalla como respaldo
    }
  }

  function iniciar() {
    if (comedorActual === 'ANTRACITA' || comedorActual === 'EXTERNO') {
      mostrarBadge();
      irAPasoClave();
    } else {
      document.getElementById('pasoComedor').classList.remove('oculto');
    }
  }

  function mostrarBadge() {
    const badge = document.getElementById('badgeComedor');
    badge.textContent = 'COMEDOR ' + comedorActual;
    badge.className = 'badge-comedor ' + (comedorActual === 'ANTRACITA' ? 'antracita' : 'externo');
  }

  function elegirComedor(comedor) {
    comedorActual = comedor;
    mostrarBadge();
    document.getElementById('pasoComedor').classList.add('oculto');
    irAPasoClave();
  }

  function irAPasoClave() {
    document.getElementById('pasoClave').classList.remove('oculto');
  }

  function llamarApi(params) {
    const url = URL_APPS_SCRIPT + '?api=1&' + new URLSearchParams(params).toString();
    return fetch(url).then(function (resp) { return resp.json(); });
  }

  function validarClave() {
    const clave = document.getElementById('inputClave').value.trim();
    const msj = document.getElementById('mensajeClave');
    if (!clave) { msj.textContent = 'Ingrese una clave.'; return; }
    msj.style.color = 'var(--gris)';
    msj.textContent = 'Verificando...';
    llamarApi({ accion: 'validarClave', comedor: comedorActual, clave: clave })
      .then(function (resultado) {
        if (resultado.success) {
          claveActual = clave;
          msj.textContent = '';
          document.getElementById('pasoClave').classList.add('oculto');
          document.getElementById('pasoTipo').classList.remove('oculto');
        } else {
          msj.style.color = 'var(--rojo)';
          msj.textContent = resultado.mensaje;
        }
      })
      .catch(function () {
        msj.style.color = 'var(--rojo)';
        msj.textContent = 'Error de conexión. Verifique su internet e intente de nuevo.';
      });
  }

  function elegirTipo(tipo) {
    tipoActual = tipo;
    document.getElementById('opAlmuerzo').classList.toggle('activo', tipo === 'ALMUERZO');
    document.getElementById('opCena').classList.toggle('activo', tipo === 'CENA');
    document.getElementById('pasoTipo').classList.add('oculto');
    document.getElementById('pasoEscaner').classList.remove('oculto');
    contadorServidos = 0;
    actualizarContador();
    desbloquearAudio_(); // desbloquea el audio aquí mismo, dentro del toque directo del usuario (requisito de Android)
    if (DEBUG_MODE) {
      document.getElementById('debugExtra').classList.remove('oculto');
      document.getElementById('bloquePruebaQr').classList.remove('oculto');
      console.log('BarcodeDetector disponible en este navegador:', ('BarcodeDetector' in window));
      console.log('Perfil QR activo:', PERFIL_ACTUAL, obtenerPerfilQr_());
    }
    iniciarCamara();
  }

  function iniciarPruebaQr() {
    tInicioPruebaQr = performance.now();
    document.getElementById('resultadoPruebaQr').textContent = 'Presente el QR ahora...';
  }

  function actualizarContador() {
    document.getElementById('contadorServidos').textContent =
      contadorServidos + ' servido(s) — ' + tipoActual + ' — COMEDOR ' + comedorActual;
  }

  function ajustarTamanoMarco_(tamanoQrbox) {
    const tam = Math.min(tamanoQrbox, Math.round(window.innerWidth * 0.65));
    const marco = document.getElementById('marcoQr');
    marco.style.width = tam + 'px';
    marco.style.height = tam + 'px';
  }

  function iniciarCamara() {
    document.getElementById('lector').innerHTML = '<p style="text-align:center; padding:20px; color:var(--gris);">Solicitando acceso a la cámara...</p>';
    const perfil = obtenerPerfilQr_();
    ajustarTamanoMarco_(perfil.qrbox); // el marco visual sigue siempre al tamaño real de qrbox del perfil activo

    Html5Qrcode.getCameras()
      .then(function (camaras) {
        if (!camaras || camaras.length === 0) {
          mostrarErrorCamara({ name: 'SinCamaras', message: 'No se detectó ninguna cámara disponible en este dispositivo.' });
          return;
        }
        document.getElementById('lector').innerHTML = '';
        document.getElementById('marcoQr').style.display = 'block';

        // Fase 1 de optimización: formatsToSupport / useBarCodeDetectorIfSupported se pasan
        // en el constructor de Html5Qrcode (no en start()), con respaldo seguro si algo fallara.
        const opcionesLector = { useBarCodeDetectorIfSupported: true };
        if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
          opcionesLector.formatsToSupport = [Html5QrcodeSupportedFormats.QR_CODE];
        }
        try {
          escanerActivo = new Html5Qrcode('lector', opcionesLector);
        } catch (e) {
          escanerActivo = new Html5Qrcode('lector'); // respaldo: si el constructor con opciones fallara, usar el modo estándar
        }

        const camaraTrasera = camaras.find(function (c) {
          return /back|trasera|rear|environment/i.test(c.label);
        });
        const idCamara = camaraTrasera ? camaraTrasera.id : camaras[camaras.length - 1].id;
        const esCamaraTraseraConfirmada = !!camaraTrasera;

        // Fase II: la estrategia 'actual' reproduce exactamente el comportamiento previo (baseline,
        // incluye el conflicto conocido idCamara/videoConstraints). La 'corregida' elimina ese
        // conflicto quitando el facingMode duplicado de videoConstraints cuando ya se seleccionó
        // una cámara específica por ID.
        const videoConstraints = (perfil.estrategiaCamara === 'actual')
          ? {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 },
              advanced: [{ focusMode: 'continuous' }]
            }
          : {
              width: { ideal: 1280 },
              height: { ideal: 720 }, // resolución más liviana: menos datos por fotograma para analizar, sin perder nitidez suficiente para leer el QR.
              advanced: [{ focusMode: 'continuous' }]
            };

        const config = { fps: 15, qrbox: perfil.qrbox, videoConstraints: videoConstraints };
        if (perfil.disableFlip && esCamaraTraseraConfirmada) {
          config.disableFlip = true;
        }

        escanerActivo.start(idCamara, config, onEscaneoExitoso)
          .then(function () { tListoParaEscanear = performance.now(); diagnosticarCamaraActiva_(); })
          .catch(function (err) {
            escanerActivo.start({ facingMode: 'environment' }, config, onEscaneoExitoso)
              .then(function () { tListoParaEscanear = performance.now(); diagnosticarCamaraActiva_(); })
              .catch(function (err2) { mostrarErrorCamara(err2); });
          });
      })
      .catch(function (err) {
        mostrarErrorCamara(err);
      });
  }

  // Diagnóstico de la cámara realmente en uso (solo consola, nunca bloquea ni detiene el escáner
  // si algo no está disponible — Android e iPhone reportan capacidades distintas).
  function diagnosticarCamaraActiva_() {
    if (!DEBUG_MODE || !escanerActivo) return;

    let capacidades = null;
    try {
      if (typeof escanerActivo.getRunningTrackCapabilities === 'function') {
        capacidades = escanerActivo.getRunningTrackCapabilities();
        console.log('Capacidades de la cámara activa:', capacidades);
      }
    } catch (e) { console.log('No se pudieron leer las capacidades de la cámara:', e.message); }

    try {
      if (typeof escanerActivo.getRunningTrackSettings === 'function') {
        const ajustes = escanerActivo.getRunningTrackSettings();
        console.log('Ajustes reales de la cámara — resolución:', ajustes.width + 'x' + ajustes.height,
          '| frameRate:', ajustes.frameRate, '| facingMode:', ajustes.facingMode,
          '| focusMode:', ajustes.focusMode, '| zoom:', ajustes.zoom,
          '| deviceId disponible:', !!ajustes.deviceId);
      }
    } catch (e) { console.log('No se pudieron leer los ajustes reales de la cámara:', e.message); }

    // Refuerzo de foco continuo: si la capacidad está disponible, se reaplica explícitamente
    // después de iniciar (verificación adicional a la restricción "advanced" inicial).
    try {
      if (capacidades && capacidades.focusMode && capacidades.focusMode.indexOf &&
          capacidades.focusMode.indexOf('continuous') !== -1 &&
          typeof escanerActivo.applyVideoConstraints === 'function') {
        escanerActivo.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] })
          .then(function () { console.log('focusMode continuous reforzado correctamente tras iniciar.'); })
          .catch(function (e) { console.log('No se pudo reforzar focusMode continuous:', e.message); });
      }
    } catch (e) { /* no crítico */ }
  }

  function mostrarErrorCamara(err) {
    document.getElementById('marcoQr').style.display = 'none';
    const nombre = (err && err.name) || 'Desconocido';
    const mensaje = (err && err.message) || String(err);
    const constraint = (err && err.constraint) ? ('<br>Restricción: ' + err.constraint) : '';
    document.getElementById('lector').innerHTML =
      '<div style="padding:16px; text-align:left; font-size:13px; color:var(--rojo); background:#fdecea; border-radius:10px;">' +
      '<b>No se pudo acceder a la cámara.</b><br><br>' +
      'Tipo de error: ' + nombre + '<br>' +
      'Mensaje: ' + mensaje + constraint +
      '<br><br><button class="btn-grande" style="padding:10px; font-size:13px;" onclick="iniciarCamara()">Reintentar</button>' +
      '</div>';
  }

  function onEscaneoExitoso(textoDecodificado, decodeResult) {
    const qrActual = String(textoDecodificado || '').trim();

    // "Modo prueba QR" (solo debug): mide desde el botón "INICIAR PRUEBA DE LECTURA" hasta esta
    // detección real de la cámara. No afecta servidor, registro ni anti-relectura — solo mide.
    if (DEBUG_MODE && tInicioPruebaQr !== null) {
      const tiempoPruebaQr = performance.now() - tInicioPruebaQr;
      document.getElementById('resultadoPruebaQr').textContent = 'PRUEBA QR: ' + Math.round(tiempoPruebaQr) + ' ms';
      tInicioPruebaQr = null;
    }
    if (DEBUG_MODE) {
      try {
        const decoderName = decodeResult && decodeResult.result && decodeResult.result.debugData && decodeResult.result.debugData.decoderName;
        console.log('Motor utilizado para esta lectura (si la librería lo informa):', decoderName || '(no informado)');
      } catch (e) { /* no crítico */ }
    }

    // Anti-relectura: ignora silenciosamente el mismo QR si ya se procesó hace pocos segundos.
    // No toca procesandoEscaneo, no llama al servidor, no suena, no cambia el contador ni la pantalla.
    const ahora = Date.now();
    if (ultimoQrProcesado === qrActual && ahora < ultimoQrProcesadoHasta) {
      console.log('QR repetido ignorado:', qrActual);
      return;
    }

    if (procesandoEscaneo) return;
    procesandoEscaneo = true;

    // --- DIAGNÓSTICO TEMPORAL DE TIEMPOS (quitar cuando ya no se necesite) ---
    const tDeteccion = tListoParaEscanear ? (performance.now() - tListoParaEscanear) : null;
    const tInicioServidor = performance.now();

    llamarApi({ accion: 'escanear', uuid: qrActual, comedor: comedorActual, tipo: tipoActual, clave: claveActual })
      .then(function (resultado) {
        // Se registra como "último QR procesado" SOLO cuando el servidor respondió de verdad
        // (éxito o rechazo funcional), nunca antes. Esto habilita la ventana de 4 segundos.
        ultimoQrProcesado = qrActual;
        ultimoQrProcesadoHasta = Date.now() + BLOQUEO_MISMO_QR_MS;

        const tServidor = performance.now() - tInicioServidor;
        mostrarTiemposDebug(tDeteccion, tServidor, resultado.debug);
        mostrarResultado(resultado);
        // Pausa fija e independiente del sonido: aunque el audio fallara por cualquier motivo,
        // el control de "no aceptar el mismo QR dos veces seguidas" sigue funcionando igual.
        const pausa = resultado.success ? PAUSA_MS_OK : PAUSA_MS_ERROR;
        setTimeout(function () { procesandoEscaneo = false; tListoParaEscanear = performance.now(); }, pausa);
      })
      .catch(function () {
        // Error de conexión: NO se registra como "último QR procesado", para permitir reintentar
        // de inmediato apenas vuelva el internet, sin esperar el bloqueo de 4 segundos.
        const tServidor = performance.now() - tInicioServidor;
        mostrarTiemposDebug(tDeteccion, tServidor, null);
        mostrarResultado({ success: false, mensaje: 'Error de conexión. Verifique su internet e intente de nuevo.' });
        setTimeout(function () { procesandoEscaneo = false; tListoParaEscanear = performance.now(); }, PAUSA_MS_ERROR);
      });
  }

  // DIAGNÓSTICO TEMPORAL: muestra cuánto tardó la detección del QR (desde que la cámara quedó lista)
  // y cuánto tardó la respuesta del servidor, para identificar dónde está realmente la demora.
  function mostrarTiemposDebug(tDeteccion, tServidor, debugBackend) {
    const el = document.getElementById('debugTiempos');
    const detTexto = tDeteccion !== null ? (tDeteccion / 1000).toFixed(2) + 's' : '—';
    const servTexto = (tServidor / 1000).toFixed(2) + 's';
    const totalTexto = tDeteccion !== null ? ((tDeteccion + tServidor) / 1000).toFixed(2) + 's' : servTexto;
    let texto = '⏱ Espera hasta QR: ' + detTexto + '  |  Servidor: ' + servTexto + '  |  Total: ' + totalTexto;
    if (debugBackend) {
      texto += ' — [clave:' + debugBackend.claveMs + 'ms uuid:' + debugBackend.uuidMs + 'ms trab:' + debugBackend.trabajadorMs +
        'ms reg:' + debugBackend.registrosMs + 'ms lock:' + debugBackend.esperaLockMs + 'ms serv:' + debugBackend.servidosMs +
        'ms esc:' + debugBackend.escrituraMs + 'ms | totalBackend:' + debugBackend.totalMs + 'ms]';
    }
    el.textContent = texto;
  }

  // Devuelve la duración del sonido en milisegundos, para poder pausar el escaneo mientras suena.
  function reproducirSonido(exito) {
    if (!audioListo || !audioCtxCompartido) return 0; // si el audio no quedó desbloqueado, no se intenta sonar (evita fallos silenciosos)
    try {
      const ctx = audioCtxCompartido;

      if (exito) {
        // BIP-BIP: dos pulsos cortos y agudos, tipo lector de código de barras
        const duracionBip = 0.16;
        const separacion = 0.09;
        [0, duracionBip + separacion].forEach(function (offset) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'square';
          osc.frequency.setValueAtTime(1500, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(1.0, ctx.currentTime + offset + 0.01);
          gain.gain.setValueAtTime(1.0, ctx.currentTime + offset + duracionBip - 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + duracionBip);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + duracionBip + 0.02);
        });
        return Math.round((duracionBip * 2 + separacion) * 1000) + 60;
      } else {
        // TON – TON: dos tonos idénticos, graves/medios, tipo campana suave (distinto en tono y
        // textura al BIP-BIP de aprobación, para diferenciarse sin necesidad de mirar la pantalla).
        const duracionTon = 0.22;
        const separacion = 0.2;
        [0, duracionTon + separacion].forEach(function (offset) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(1.0, ctx.currentTime + offset + 0.015);
          gain.gain.setValueAtTime(1.0, ctx.currentTime + offset + duracionTon - 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + duracionTon);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + duracionTon + 0.02);
        });
        return Math.round((duracionTon * 2 + separacion) * 1000) + 60;
      }
    } catch (e) {
      return 0;
    }
  }
  // Devuelve la duración del sonido reproducido (ms), para que quien llame pueda pausar
  // brevemente la lectura de nuevos QR hasta que el sonido termine de escucharse completo.
  function mostrarResultado(resultado) {
    const cont = document.getElementById('resultadoEscaneo');
    cont.classList.remove('oculto');
    const duracionSonido = reproducirSonido(resultado.success);
    if (resultado.success) {
      contadorServidos++;
      actualizarContador();
      cont.className = 'resultado ok';
      cont.textContent = '✔ ' + resultado.nombre + ' — servido correctamente';
      if (navigator.vibrate) navigator.vibrate(120);
    } else {
      cont.className = 'resultado error';
      cont.textContent = '✘ ' + resultado.mensaje;
      if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
    }
    setTimeout(function () { cont.classList.add('oculto'); }, Math.max(3000, duracionSonido));
    return duracionSonido;
  }

  function reiniciarFlujo() {
    if (escanerActivo) { escanerActivo.stop().catch(function () {}); }
    tListoParaEscanear = null;
    document.getElementById('marcoQr').style.display = 'none';
    document.getElementById('pasoEscaner').classList.add('oculto');
    document.getElementById('pasoTipo').classList.remove('oculto');
  }

  iniciar();
</script>
